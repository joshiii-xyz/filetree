[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "filetree"
version = "0.1.0"
description = "A fast, readable, cross-platform directory tree CLI."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Filesystems",
]
keywords = ["cli", "directory", "tree", "filesystem"]

[project.optional-dependencies]
dev = ["mypy>=1.13", "ruff>=0.8"]

[project.scripts]
filetree = "filetree.cli:main"

[project.urls]
Repository = "https://github.com/joshiii-xyz/filetree"
Issues = "https://github.com/joshiii-xyz/filetree/issues"
Changelog = "https://github.com/joshiii-xyz/filetree/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
files = ["src"]
strict = true
warn_unreachable = true
